syntax = "proto3";

package func;

option cc_enable_arenas = true;

service FuncService {
    rpc tool_estimation (ParamsData) returns (ResultData) {}
    rpc tool_estimation_stream (ParamsData) returns (stream ProgressData) {}
}

message ParamsData {
    int32  project_id  = 1;
    int32  user_id     = 2;
    int32  case_id     = 3;
    int32  async       = 4;
    string result_type = 5;
    string type        = 6;
    string param1      = 7;
    string param2      = 8;
}

message ResultData {
    int32  code    = 1;
    string message = 2;
    string data    = 3;
}

message ProgressList {
    int32  percent = 1;
    int32  done    = 2;
    string title   = 3;
}

message ProgressData {
    int32        code    = 1;
    string       message = 2;
    ProgressList data    = 3;
}
